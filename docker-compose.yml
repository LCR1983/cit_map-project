
services:
  db:
    image: mysql:8.0
    container_name: map-project-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cit_DXproject.1024
      MYSQL_DATABASE: ds_project_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcit_DXproject.1024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./map-project/backend
      dockerfile: Dockerfile
    container_name: map-project-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ds_project_db?serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=cit_DXproject.1024
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ./map-project/api
      dockerfile: Dockerfile
    container_name: map-project-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=cit_DXproject.1024
      - DB_NAME=ds_project_db
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: nginx:alpine
    container_name: map-project-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./map-project:/usr/share/nginx/html

volumes:
  mysql_data:
