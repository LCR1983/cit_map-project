version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: attack-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cit_DXproject.1024
      MYSQL_DATABASE: ds_project_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 一つ上の階層（cit-map-project直下）の mysql/init フォルダを参照します
      - ../mysql/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcit_DXproject.1024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./app/backend
    container_name: attack-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ds_project_db?serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=cit_DXproject.1024
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  frontend:
    build: ./app/frontend
    container_name: attack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
