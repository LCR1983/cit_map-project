<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>関東マップ 多角形当たり判定エディタ</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left: SVG Canvas Area */
    #canvas-area {
      position: relative;
      flex: 0 0 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border-right: 1px solid var(--border);
    }

    #canvas-title {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #svg-wrap {
      position: relative;
      width: 500px;
      height: 500px;
      background: #131b2e;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    #kanto-svg {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Grid Overlay */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(244, 63, 94, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 63, 94, 0.08) 1px, transparent 1px);
      background-size: 25px 25px;
    }

    /* Drag snapping indicator or guidance */
    #snap-info {
      position: absolute;
      bottom: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 8px 16px;
      border-radius: 30px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    /* Right: Control Panel */
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      overflow: hidden;
    }

    #panel-header {
      padding: 20px 24px;
      background: #111827;
      border-bottom: 1px solid var(--border);
    }

    #panel-header h1 {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: bold;
    }

    #panel-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Prefecture List Scroll Area */
    #pref-list {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .pref-row {
      background: #111827;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pref-row:hover {
      border-color: #475569;
    }

    .pref-row.selected {
      border-color: var(--accent);
      background: rgba(244, 63, 94, 0.08);
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.15);
    }

    .pref-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pref-name {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .pref-points-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pref-actions {
      display: flex;
      gap: 8px;
    }

    .row-btn {
      background: #334155;
      border: none;
      color: #fff;
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .row-btn:hover {
      background: #475569;
    }

    .row-btn.reset-btn {
      background: #1e293b;
      border: 1px solid var(--border);
    }

    .row-btn.reset-btn:hover {
      background: #334155;
    }

    /* Import and Output section */
    #bottom-controls {
      background: #111827;
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    .input-textarea {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 0.75rem;
      resize: none;
    }

    #import-area {
      height: 60px;
    }

    #code-output {
      height: 120px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .primary-btn {
      flex: 1;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), #fb923c);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: filter 0.2s;
      text-align: center;
    }

    .primary-btn:hover {
      filter: brightness(1.1);
    }

    .secondary-btn {
      padding: 10px 16px;
      background: #334155;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .secondary-btn:hover {
      background: #475569;
    }

    /* SVG Interactive styles */
    .sv-pref {
      opacity: 0.65;
      transition: opacity 0.2s;
    }

    .sv-pref.selected {
      opacity: 0.9;
    }

    /* Hit Area Polygons */
    .editor-poly {
      fill: rgba(148, 163, 184, 0.15);
      stroke: #64748b;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      pointer-events: none;
    }

    .editor-poly.active-poly {
      fill: rgba(244, 63, 94, 0.25);
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-dasharray: none;
    }

    /* Control Points (Circles) */
    .control-point {
      fill: #fff;
      stroke: var(--accent);
      stroke-width: 2px;
      cursor: move;
      transition: r 0.15s ease, fill 0.15s ease;
    }

    .control-point:hover {
      r: 8;
      fill: var(--accent);
    }

    /* Temporary line while drawing or dragging */
    .guide-line {
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 2 2;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="canvas-area">
    <div id="canvas-title">
      <span>🗾 関東地方マップキャンバス (500x500)</span>
    </div>
    <div id="svg-wrap">
      <div id="grid-overlay"></div>
      <svg id="kanto-svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
        <!-- background images synced with index.html coordinate locations -->
        <image id="sv-gunma" href="3_kantou3__gunma.png" x="12" y="27" width="252" height="243" class="sv-pref" />
        <image id="sv-tochigi" href="3_kantou2__tochigi.png" x="145" y="3" width="242" height="228" class="sv-pref" />
        <image id="sv-ibaraki" href="3_kantou1__ibaraki.png" x="208" y="38" width="271" height="290" class="sv-pref" />
        <image id="sv-saitama" href="3_kantou4__saitama.png" x="85" y="122" width="207" height="243" class="sv-pref" />
        <image id="sv-chiba" href="3_kantou5__chiba.png" x="192" y="190" width="265" height="301" class="sv-pref" />
        <image id="sv-tokyo" href="3_kantou6__tokyo.png" x="118" y="180" width="181" height="200" class="sv-pref" />
        <image id="sv-kanagawa" href="3_kantou7__kanagawa.png" x="124" y="251" width="142" height="195"
          class="sv-pref" />

        <!-- Render group for Polygons and Control Points -->
        <g id="poly-group"></g>
        <g id="handle-group"></g>
      </svg>
      <div id="snap-info">【操作】キャンバス空き地クリック: 点を追加 | 点をドラッグ: 移動 | 点をダブルクリック: 削除</div>
    </div>
  </div>

  <div id="panel">
    <div id="panel-header">
      <h1>🗾 多角形（Polygon）当たり判定エディタ</h1>
      <p>各県を選択してキャンバス上をクリック・ドラッグし、当たり判定の多角形を直感的に作成します。完成したコードをコピーし index.html に貼り付けます。</p>
    </div>

    <div id="pref-list"></div>

    <div id="bottom-controls">
      <div class="control-group">
        <label for="import-area">📥 points または &lt;polygon&gt; タグのインポート (選択中の県に反映)</label>
        <textarea id="import-area" class="input-textarea"
          placeholder="例: 12,27 264,27 264,270 12,270 または &lt;polygon points=&quot;...&quot; /&gt; を貼り付けてインポート"></textarea>
        <button id="import-btn" class="secondary-btn"
          style="margin-top:4px; padding: 6px 12px; font-size: 0.78rem;">貼り付けたデータを適用</button>
      </div>

      <div class="control-group">
        <label for="code-output">📋 コピー用コード（index.html の SVG 内に貼り付け）</label>
        <textarea id="code-output" class="input-textarea" readonly></textarea>
      </div>

      <div class="btn-row">
        <button id="copy-btn" class="primary-btn">📋 コードをコピー</button>
      </div>
    </div>
  </div>

  <script>

    const prefs = [

        points: [{ x: 156, y: 44 }, { x: 163, y: 46 }, { x: 175, y: 67 }, { x: 187, y: 61 }, { x: 211, y: 69 }, { x: 201, y: 87 }, { x: 208, y: 97 }, { x: 199, y: 121 }, { x: 202, y: 129 }, { x: 219, y: 131 }, { x: 221, y: 137 }, { x: 219, y: 146 }, { x: 208, y: 159 }, { x: 207, y: 172 }, { x: 216, y: 184 }, { x: 244, y: 192 }, { x: 249, y: 208 }, { x: 231, y: 215 }, { x: 222, y: 213 }, { x: 213, y: 204 }, { x: 198, y: 207 }, { x: 168, y: 198 }, { x: 161, y: 200 }, { x: 155, y: 220 }, { x: 148, y: 228 }, { x: 122, y: 236 }, { x: 94, y: 254 }, { x: 76, y: 239 }, { x: 72, y: 223 }, { x: 78, y: 174 }, { x: 51, y: 174 }, { x: 41, y: 169 }, { x: 46, y: 136 }, { x: 54, y: 120 }, { x: 69, y: 113 }, { x: 89, y: 110 }, { x: 98, y: 94 }, { x: 120, y: 90 }, { x: 128, y: 79 }, { x: 127, y: 63 }, { x: 155, y: 45 }]
      },
      {
        id: 'tochigi',
        name: '栃木県',
        points: [{ x: 292, y: 22 }, { x: 322, y: 34 }, { x: 336, y: 45 }, { x: 335, y: 52 }, { x: 341, y: 68 }, { x: 338, y: 78 }, { x: 344, y: 108 }, { x: 341, y: 116 }, { x: 334, y: 119 }, { x: 338, y: 142 }, { x: 329, y: 167 }, { x: 308, y: 176 }, { x: 290, y: 180 }, { x: 269, y: 202 }, { x: 247, y: 212 }, { x: 235, y: 207 }, { x: 230, y: 194 }, { x: 206, y: 189 }, { x: 193, y: 173 }, { x: 193, y: 157 }, { x: 203, y: 146 }, { x: 206, y: 137 }, { x: 188, y: 133 }, { x: 184, y: 125 }, { x: 184, y: 115 }, { x: 194, y: 97 }, { x: 187, y: 89 }, { x: 191, y: 76 }, { x: 197, y: 68 }, { x: 209, y: 69 }, { x: 219, y: 59 }, { x: 263, y: 30 }, { x: 291, y: 22 }]
      },
      {
        id: 'ibaraki',
        name: '茨城県',
        points: [{ x: 333, y: 51 }, { x: 359, y: 78 }, { x: 365, y: 64 }, { x: 374, y: 54 }, { x: 421, y: 76 }, { x: 395, y: 130 }, { x: 390, y: 151 }, { x: 390, y: 178 }, { x: 382, y: 187 }, { x: 381, y: 206 }, { x: 395, y: 254 }, { x: 408, y: 265 }, { x: 425, y: 308 }, { x: 415, y: 308 }, { x: 396, y: 290 }, { x: 364, y: 269 }, { x: 348, y: 278 }, { x: 312, y: 284 }, { x: 295, y: 271 }, { x: 281, y: 265 }, { x: 270, y: 254 }, { x: 265, y: 239 }, { x: 247, y: 238 }, { x: 239, y: 226 }, { x: 234, y: 203 }, { x: 243, y: 207 }, { x: 256, y: 201 }, { x: 285, y: 170 }, { x: 300, y: 167 }, { x: 320, y: 157 }, { x: 327, y: 134 }, { x: 322, y: 107 }, { x: 333, y: 99 }, { x: 331, y: 83 }, { x: 327, y: 74 }, { x: 328, y: 56 }, { x: 332, y: 52 }]
      },
      {

        name: '埼玉県',
        points: [{ x: 167, y: 183 }, { x: 193, y: 193 }, { x: 205, y: 189 }, { x: 214, y: 199 }, { x: 221, y: 201 }, { x: 230, y: 196 }, { x: 235, y: 196 }, { x: 244, y: 221 }, { x: 251, y: 228 }, { x: 263, y: 252 }, { x: 270, y: 270 }, { x: 272, y: 288 }, { x: 267, y: 290 }, { x: 255, y: 285 }, { x: 250, y: 290 }, { x: 240, y: 286 }, { x: 219, y: 294 }, { x: 215, y: 286 }, { x: 212, y: 286 }, { x: 200, y: 294 }, { x: 192, y: 292 }, { x: 184, y: 280 }, { x: 169, y: 279 }, { x: 148, y: 268 }, { x: 142, y: 268 }, { x: 138, y: 278 }, { x: 134, y: 279 }, { x: 107, y: 267 }, { x: 101, y: 258 }, { x: 100, y: 243 }, { x: 133, y: 219 }, { x: 147, y: 216 }, { x: 157, y: 188 }, { x: 167, y: 184 }]
      },
      {
        id: 'chiba',
        name: '千葉県',
        points: [{ x: 248, y: 211 }, { x: 267, y: 214 }, { x: 282, y: 241 }, { x: 313, y: 260 }, { x: 348, y: 253 }, { x: 359, y: 245 }, { x: 368, y: 246 }, { x: 424, y: 293 }, { x: 419, y: 299 }, { x: 377, y: 317 }, { x: 359, y: 336 }, { x: 353, y: 359 }, { x: 357, y: 373 }, { x: 357, y: 400 }, { x: 332, y: 418 }, { x: 298, y: 435 }, { x: 278, y: 466 }, { x: 267, y: 466 }, { x: 254, y: 457 }, { x: 252, y: 452 }, { x: 263, y: 438 }, { x: 259, y: 409 }, { x: 269, y: 396 }, { x: 259, y: 382 }, { x: 261, y: 367 }, { x: 287, y: 346 }, { x: 303, y: 324 }, { x: 296, y: 312 }, { x: 283, y: 312 }, { x: 278, y: 305 }, { x: 270, y: 282 }, { x: 269, y: 261 }, { x: 247, y: 218 }, { x: 247, y: 211 }]
      },
      {
        id: 'tokyo',
        name: '東京都',
        points: [{ x: 142, y: 247 }, { x: 169, y: 263 }, { x: 185, y: 265 }, { x: 196, y: 281 }, { x: 215, y: 270 }, { x: 218, y: 270 }, { x: 223, y: 280 }, { x: 231, y: 275 }, { x: 237, y: 276 }, { x: 241, y: 271 }, { x: 250, y: 275 }, { x: 263, y: 270 }, { x: 273, y: 276 }, { x: 284, y: 319 }, { x: 261, y: 330 }, { x: 255, y: 329 }, { x: 256, y: 336 }, { x: 254, y: 347 }, { x: 243, y: 345 }, { x: 221, y: 321 }, { x: 217, y: 324 }, { x: 218, y: 342 }, { x: 215, y: 347 }, { x: 211, y: 346 }, { x: 193, y: 329 }, { x: 175, y: 328 }, { x: 164, y: 314 }, { x: 148, y: 312 }, { x: 130, y: 267 }, { x: 134, y: 252 }, { x: 141, y: 248 }]
      },
      {
        id: 'kanagawa',
        name: '神奈川県',
        points: [{ x: 160, y: 278 }, { x: 169, y: 281 }, { x: 175, y: 289 }, { x: 182, y: 294 }, { x: 193, y: 293 }, { x: 212, y: 309 }, { x: 211, y: 293 }, { x: 217, y: 287 }, { x: 224, y: 287 }, { x: 235, y: 303 }, { x: 241, y: 303 }, { x: 245, y: 309 }, { x: 251, y: 309 }, { x: 250, y: 317 }, { x: 239, y: 335 }, { x: 235, y: 348 }, { x: 237, y: 359 }, { x: 247, y: 366 }, { x: 251, y: 375 }, { x: 243, y: 399 }, { x: 227, y: 410 }, { x: 224, y: 403 }, { x: 223, y: 392 }, { x: 215, y: 373 }, { x: 195, y: 368 }, { x: 176, y: 379 }, { x: 170, y: 387 }, { x: 163, y: 411 }, { x: 155, y: 408 }, { x: 149, y: 401 }, { x: 144, y: 359 }, { x: 135, y: 353 }, { x: 132, y: 344 }, { x: 155, y: 317 }, { x: 156, y: 298 }, { x: 155, y: 283 }, { x: 160, y: 279 }]
      }
    ];

    let selectedPrefId = 'gunma';
    let draggingPoint = null; // { prefId, index }
    const svg = document.getElementById('kanto-svg');

    // --- Build Panel Rows ---
    const listEl = document.getElementById('pref-list');

    function initPanel() {
      listEl.textContent = ''; // safe clear
      prefs.forEach(p => {
        const row = document.createElement('div');
        row.className = 'pref-row';
        row.id = `row-${p.id}`;
        if (p.id === selectedPrefId) row.classList.add('selected');

        const info = document.createElement('div');
        info.className = 'pref-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'pref-name';
        nameSpan.textContent = p.name;

        const countSpan = document.createElement('span');
        countSpan.className = 'pref-points-count';
        countSpan.id = `count-${p.id}`;
        countSpan.textContent = `頂点数: ${p.points.length}`;

        info.appendChild(nameSpan);
        info.appendChild(countSpan);

        const actions = document.createElement('div');
        actions.className = 'pref-actions';

        const clearBtn = document.createElement('button');
        clearBtn.className = 'row-btn';
        clearBtn.textContent = 'クリア';
        clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          p.points = [];
          updateUI();
        });

        const resetBtn = document.createElement('button');
        resetBtn.className = 'row-btn reset-btn';
        resetBtn.textContent = '初期矩形';
        resetBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          resetToDefault(p.id);
          updateUI();
        });

        actions.appendChild(clearBtn);
        actions.appendChild(resetBtn);

        row.appendChild(info);
        row.appendChild(actions);

        row.addEventListener('click', () => {
          selectPref(p.id);
        });

        listEl.appendChild(row);
      });
    }

    function resetToDefault(prefId) {
      const p = prefs.find(x => x.id === prefId);
      if (!p) return;
      // sync with original bounds
      const bounds = {
        gunma: { x: 12, y: 27, w: 252, h: 243 },
        tochigi: { x: 145, y: 3, w: 242, h: 228 },
        ibaraki: { x: 208, y: 38, w: 271, h: 290 },
        saitama: { x: 85, y: 122, w: 207, h: 243 },
        chiba: { x: 192, y: 190, w: 265, h: 301 },
        tokyo: { x: 118, y: 180, w: 181, h: 200 },
        kanagawa: { x: 124, y: 251, w: 142, h: 195 }
      }[prefId];

      p.points = [
        { x: bounds.x, y: bounds.y },
        { x: bounds.x + bounds.w, y: bounds.y },
        { x: bounds.x + bounds.w, y: bounds.y + bounds.h },
        { x: bounds.x, y: bounds.y + bounds.h }
      ];
    }

    function selectPref(prefId) {
      selectedPrefId = prefId;
      document.querySelectorAll('.pref-row').forEach(r => r.classList.remove('selected'));
      const activeRow = document.getElementById(`row-${prefId}`);
      if (activeRow) activeRow.classList.add('selected');

      // Highlight corresponding image
      document.querySelectorAll('.sv-pref').forEach(img => {
        img.classList.toggle('selected', img.id === `sv-${prefId}`);
      });

      updateUI();
    }

    // --- Render Polygons and Handles ---
    const polyGroup = document.getElementById('poly-group');
    const handleGroup = document.getElementById('handle-group');

    function updateUI() {
      // Clear groups safely
      polyGroup.textContent = '';
      handleGroup.textContent = '';

      prefs.forEach(p => {
        const pointsStr = p.points.map(pt => `${pt.x},${pt.y}`).join(' ');

        // Create SVG Polygon
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pointsStr);
        poly.setAttribute('class', `editor-poly ${p.id === selectedPrefId ? 'active-poly' : ''}`);
        polyGroup.appendChild(poly);

        // Update panel count text
        const countEl = document.getElementById(`count-${p.id}`);
        if (countEl) {
          countEl.textContent = `頂点数: ${p.points.length}`;
        }
      });

      // Render Handles for active pref
      const activePref = prefs.find(x => x.id === selectedPrefId);
      if (activePref) {
        activePref.points.forEach((pt, idx) => {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', pt.x);
          circle.setAttribute('cy', pt.y);
          circle.setAttribute('r', 6);
          circle.setAttribute('class', 'control-point');
          circle.dataset.index = idx;

          // Drag Start
          circle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            const rect = svg.getBoundingClientRect();
            draggingPoint = {
              prefId: selectedPrefId,
              index: idx,
              rect
            };
          });

          // Delete Point on dblclick
          circle.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            activePref.points.splice(idx, 1);
            updateUI();
            updateCode();
          });

          handleGroup.appendChild(circle);
        });
      }

      updateCode();
    }

    // --- Add Points ---
    svg.addEventListener('click', (e) => {
      // Check if clicking handle or image
      if (e.target.classList.contains('control-point')) return;

      const activePref = prefs.find(x => x.id === selectedPrefId);
      if (!activePref) return;

      const rect = svg.getBoundingClientRect();
      const scaleX = 500 / rect.width;
      const scaleY = 500 / rect.height;

      const clickX = Math.round((e.clientX - rect.left) * scaleX);
      const clickY = Math.round((e.clientY - rect.top) * scaleY);

      // Boundary check
      const x = Math.max(0, Math.min(500, clickX));
      const y = Math.max(0, Math.min(500, clickY));

      activePref.points.push({ x, y });
      updateUI();
      updateCode();
    });

    // --- Drag Points ---
    window.addEventListener('mousemove', (e) => {
      if (!draggingPoint) return;

      const activePref = prefs.find(x => x.id === draggingPoint.prefId);
      if (!activePref) return;

      const rect = draggingPoint.rect;
      const scaleX = 500 / rect.width;
      const scaleY = 500 / rect.height;

      const mouseX = Math.round((e.clientX - rect.left) * scaleX);
      const mouseY = Math.round((e.clientY - rect.top) * scaleY);

      const x = Math.max(0, Math.min(500, mouseX));
      const y = Math.max(0, Math.min(500, mouseY));

      activePref.points[draggingPoint.index] = { x, y };

      updateUI();
    });

    window.addEventListener('mouseup', () => {
      if (draggingPoint) {
        draggingPoint = null;
        updateCode();
      }
    });

    // --- Code Generator ---
    const codeOutput = document.getElementById('code-output');

    function updateCode() {
      const polygonLines = prefs.map(p => {
        const pointsStr = p.points.map(pt => `${pt.x},${pt.y}`).join(' ');
        return `                    <polygon data-target="${p.id}" points="${pointsStr}" fill="rgba(0,0,0,0.001)" class="pref-hit" style="cursor:pointer;" pointer-events="all" />`;
      }).join('\n');

      codeOutput.textContent = `                    <!-- === 県別多角形当たり判定（index.html の SVG 内に差し替え） === -->\n${polygonLines}`;
    }

    // --- Import Logic ---
    const importArea = document.getElementById('import-area');
    const importBtn = document.getElementById('import-btn');

    importBtn.addEventListener('click', () => {
      const text = importArea.value.trim();
      if (!text) return;

      const activePref = prefs.find(x => x.id === selectedPrefId);
      if (!activePref) return;

      // Extract points attribute or parse simple text coords
      let pointsStr = '';
      const match = text.match(/points=["']([^"']+)["']/);
      if (match) {
        pointsStr = match[1];
      } else {
        // Try parsing raw points format: e.g. "12,27 264,27 264,270"
        pointsStr = text;
      }

      // Convert points string to array of {x, y}
      const coordPairs = pointsStr.split(/\s+/).filter(Boolean);
      const newPoints = [];
      let valid = true;

      for (const pair of coordPairs) {
        const parts = pair.split(',');
        if (parts.length === 2) {
          const x = parseInt(parts[0], 10);
          const y = parseInt(parts[1], 10);
          if (!isNaN(x) && !isNaN(y)) {
            newPoints.push({ x, y });
          } else {
            valid = false;
          }
        } else {
          valid = false;
        }
      }

      if (valid && newPoints.length >= 3) {
        activePref.points = newPoints;
        updateUI();
        importArea.value = '';
        alert(`${activePref.name} の多角形データをインポートしました！`);
      } else {
        alert('インポート形式が正しくありません。 x,y x,y ... の形式か、<polygon points="..." /> タグをそのまま貼り付けてください（頂点数は3点以上必要です）。');
      }
    });

    // --- Copy Code ---
    const copyBtn = document.getElementById('copy-btn');
    copyBtn.addEventListener('click', () => {
      codeOutput.select();
      navigator.clipboard.writeText(codeOutput.value).then(() => {
        copyBtn.textContent = '✅ コピーしました！';
        setTimeout(() => {
          copyBtn.textContent = '📋 コードをコピー';
        }, 2000);
      }).catch(err => {
        alert('コピーに失敗しました。テキストエリアから直接コピーしてください。');
      });
    });

    // --- Initial Setup ---
    initPanel();
    updateUI();
    selectPref('gunma');
  </script>
</body>

</html>
