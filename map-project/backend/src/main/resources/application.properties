spring.application.name=dsproject
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/ds_project_db?serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=cit_DXproject.1024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPAの設定（テーブルを自動作成してくれる機能）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama（AI）のAPIエンドポイント。Docker起動時はdocker-composeの環境変数で上書きされます。
ollama.api.url=http://host.docker.internal:11434/api/generate

# ─── 管理者ツール認証設定 ───
# 管理者ユーザー名
admin.username=admin
# 管理者パスワード（平文 → 起動時にBCryptハッシュへ自動変換されます）
admin.password.raw=cit_DXproject.1024
# セッション有効期限（秒）── 2時間 = 7200秒
admin.session.timeout=7200
