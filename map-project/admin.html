<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>システム管理ツール - Kanto Local Food Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin specific styles */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        .admin-header {
            background: var(--bg-sec);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .admin-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* --- Login View --- */
        #login-view {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            box-shadow: 0 25px 50px var(--shadow-hover);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #login-view h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-sec);
            font-size: 0.9rem;
        }

        .admin-input {
            width: 100%;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
            transition: var(--transition);
        }

        .admin-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
            min-height: 20px;
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-size: 1.1rem;
        }

        /* --- Dashboard View --- */
        #dashboard-view {
            width: 100%;
            max-width: 1000px;
            align-self: flex-start;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 25px;
            box-shadow: 0 10px 25px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-card .stat-title {
            color: var(--text-sec);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .stat-card .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .dashboard-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 25px;
            flex: 1;
            min-width: 300px;
            transition: var(--transition);
        }

        .action-card:hover {
            border-color: var(--accent);
            box-shadow: 0 15px 35px var(--shadow-hover);
            transform: translateY(-5px);
        }

        .action-card h3 {
            color: var(--text-main);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: transparent;
            color: var(--text-sec);
            border: 2px solid var(--border-color);
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .is-loading .spinner {
            display: inline-block;
        }

        .is-loading .btn-text {
            display: none;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-logo">
            <span>🛡️</span> システム管理ツール
        </div>
        <div id="header-actions" style="display: none;">
            <button id="logout-btn" class="logout-btn">ログアウト</button>
        </div>
    </header>

    <main class="admin-main">
        <!-- ログインビュー -->
        <div id="login-view">
            <h1>管理者ログイン</h1>
            <form id="login-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="username">ユーザー名</label>
                    <input type="text" id="username" class="admin-input" placeholder="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" class="admin-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div id="login-error" class="error-message"></div>
                <button type="submit" id="login-submit" class="neon-button login-btn">
                    <span class="btn-text">ログイン</span>
                    <span class="spinner"></span>
                </button>
            </form>
        </div>

        <!-- ダッシュボードビュー -->
        <div id="dashboard-view">
            <div class="dashboard-header">
                <h2>管理ダッシュボード</h2>
                <p style="color:var(--text-sec); font-weight:600;">ステータス: <span style="color:var(--success);">連携中</span></p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-title">特産品データベース件数</div>
                    <div class="stat-value">504</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">ユーザーレビュー件数</div>
                    <div class="stat-value" id="stat-reviews">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">アクティブセッション</div>
                    <div class="stat-value">1</div>
                </div>
            </div>

            <div class="dashboard-actions">
                <div class="action-card">
                    <h3>📊 データ管理</h3>
                    <p style="color:var(--text-sec); margin-bottom:20px; font-size:0.9rem;">特産品データや店舗情報を管理・更新します。</p>
                    <button class="neon-button" id="open-data-btn" style="width:100%; background:var(--bg-sec); border:1px solid var(--border-color); color:var(--text-main); box-shadow:none;">データ管理を開く</button>
                </div>
                <div class="action-card">
                    <h3>💬 レビュー管理</h3>
                    <p style="color:var(--text-sec); margin-bottom:20px; font-size:0.9rem;">ユーザーから送信されたフィードバックや評価を確認します。</p>
                    <button class="neon-button" id="open-review-btn" style="width:100%;">レビュー管理を開く</button>
                </div>
            </div>
            
            <!-- Data Management Section (Hidden by default) -->
            <div id="data-section" style="display:none; margin-top: 40px; background:var(--card-bg); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3>特産品データ一覧</h3>
                    <button id="close-data-btn" class="logout-btn" style="padding: 5px 15px; font-size:0.85rem;">閉じる</button>
                </div>
                <div style="overflow-x:auto;">
                    <table style="width:100%; border-collapse:collapse; text-align:left;">
                        <thead>
                            <tr style="border-bottom:2px solid var(--border-color);">
                                <th style="padding:10px;">ID</th>
                                <th style="padding:10px;">名前</th>
                                <th style="padding:10px;">県</th>
                                <th style="padding:10px;">季節</th>
                                <th style="padding:10px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="data-table-body">
                            <tr><td colspan="5" style="padding:10px; text-align:center;">データを読み込み中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Review Management Section (Hidden by default) -->
            <div id="review-section" style="display:none; margin-top: 40px; background:var(--card-bg); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3>ユーザーレビュー一覧</h3>
                    <button id="close-review-btn" class="logout-btn" style="padding: 5px 15px; font-size:0.85rem;">閉じる</button>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <button id="analyze-reviews-btn" class="neon-button" style="background:linear-gradient(135deg, #8b5cf6, #d946ef);">🤖 AIレビュー分析を実行</button>
                    <div id="ai-report-container" style="display:none; margin-top: 15px; padding:15px; background:rgba(139, 92, 246, 0.1); border:1px solid #8b5cf6; border-radius:var(--radius-md); white-space:pre-wrap; line-height:1.6; color:var(--text-main);"></div>
                </div>

                <div style="overflow-x:auto;">
                    <table style="width:100%; border-collapse:collapse; text-align:left;">
                        <thead>
                            <tr style="border-bottom:2px solid var(--border-color);">
                                <th style="padding:10px; width:60px;">星</th>
                                <th style="padding:10px;">コメント</th>
                                <th style="padding:10px; width:150px;">投稿日時</th>
                                <th style="padding:10px; width:80px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="review-table-body">
                            <tr><td colspan="4" style="padding:10px; text-align:center;">データを読み込み中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
