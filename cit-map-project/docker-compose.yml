services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    container_name: map-project-db-1033
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cit_DXproject.1024
      MYSQL_DATABASE: ds_project_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcit_DXproject.1024" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./map-project/backend
      dockerfile: Dockerfile
    container_name: map-project-backend-1033
    restart: always
    ports:
      - "8081:8080"
    environment:
      - "SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ds_project_db?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=cit_DXproject.1024
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./map-project/frontend
    container_name: map-project-frontend-1033
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  mysql_data:
