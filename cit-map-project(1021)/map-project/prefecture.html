<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="description" content="各都道府県の旬の食材や地域グルメを紹介します。">
  <title>ご当地グルメ・特産品詳細</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== Hero Section ===== */
    .pref-hero-section {
      text-align: center;
      margin-bottom: 36px;
      padding: 56px 24px 48px;
      background: var(--bg-sec);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 15px 40px var(--shadow-color);
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease;
    }

    .pref-hero-section::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: var(--accent-gradient);
      opacity: 0.06;
      border-radius: 50%;
      pointer-events: none;
    }

    .pref-hero-section::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 160px;
      height: 160px;
      background: var(--accent-gradient);
      opacity: 0.05;
      border-radius: 50%;
      pointer-events: none;
    }

    .pref-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 18px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pref-hero-section h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text-main) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .pref-hero-section p {
      font-size: 1rem;
      color: var(--text-sec);
    }

    /* ===== Season Filter Bar ===== */
    .season-filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 24px;
      background: var(--bg-sec);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 30px;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: background 0.4s ease;
    }

    .season-filter-bar .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sec);
      white-space: nowrap;
    }

    .season-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 18px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border-color);
      background: transparent;
      color: var(--text-sec);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .season-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(244, 63, 94, 0.06);
    }

    .season-btn.active {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
    }

    /* ===== Card Grid ===== */
    .pref-food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 24px;
      width: 100%;
    }

    /* ===== Unified Food Card ===== */
    .food-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.25, 0.8, 0.25, 1),
        box-shadow 0.28s ease,
        border-color 0.28s ease;
      box-shadow: 0 6px 18px var(--shadow-color);
      position: relative;
    }

    .food-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 18px 36px var(--shadow-hover);
      border-color: var(--accent);
    }

    .food-card:focus {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .food-card-img-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .food-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .food-card:hover .food-card-img-wrap img {
      transform: scale(1.07);
    }

    /* Season badge on image */
    .food-card-season-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .season-spring {
      background: linear-gradient(135deg, #fb923c, #f43f5e);
    }

    .season-summer {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    }

    .season-autumn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
    }

    .season-winter {
      background: linear-gradient(135deg, #818cf8, #6366f1);
    }

    /* Fav button on image */
    .food-card-fav {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      z-index: 10;
      flex-shrink: 0;
    }

    .food-card-fav:hover {
      background: rgba(244, 63, 94, 0.85);
      transform: scale(1.15);
    }

    .food-card-fav.active {
      background: var(--accent);
      color: #fff;
    }

    /* Card body */
    .food-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .food-card-body h4 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .food-card-body p {
      font-size: 0.82rem;
      color: var(--text-sec);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }

    .food-card-detail-hint {
      margin-top: auto;
      padding-top: 10px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== Empty State ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sec);
    }

    .empty-state .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* ===== Detail Modal (pref page style) ===== */
    .pref-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .pref-modal-overlay.is-open {
      visibility: visible;
      opacity: 1;
    }

    .pref-modal-box {
      position: relative;
      background: var(--bg-sec);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      transform: scale(0.94) translateY(16px);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-wrap: wrap;
      gap: 0;
    }

    .pref-modal-overlay.is-open .pref-modal-box {
      transform: scale(1) translateY(0);
    }

    .pref-modal-img-col {
      flex: 0 0 280px;
      min-height: 280px;
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .pref-modal-img-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pref-modal-info-col {
      flex: 1;
      min-width: 260px;
      padding: 36px 32px 32px;
      display: flex;
      flex-direction: column;
    }

    .pref-modal-season-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      width: fit-content;
      margin-bottom: 14px;
    }

    .pref-modal-info-col h3 {
      font-size: 1.5rem;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .pref-modal-info-col .modal-description {
      font-size: 0.95rem;
      color: var(--text-sec);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .pref-modal-divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 0 0 18px;
    }

    .modal-meta-row {
      margin-bottom: 14px;
    }

    .modal-meta-row h4 {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .modal-meta-row p {
      font-size: 0.95rem;
      color: var(--text-main);
      margin: 0;
      font-weight: 500;
    }

    .pref-modal-actions {
      margin-top: auto;
      padding-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .modal-fav-btn {
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border-color);
      background: transparent;
      color: var(--text-sec);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-fav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-fav-btn.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    .pref-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--bg-main);
      color: var(--text-sec);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      z-index: 10;
    }

    .pref-modal-close:hover {
      background: var(--danger);
      color: #fff;
      transform: rotate(90deg);
    }

    /* ===== Back-to-top ===== */
    .pref-back-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .pref-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-sec);
      text-decoration: none;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background: var(--bg-sec);
      transition: all 0.2s;
    }

    .pref-back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 600px) {
      .pref-modal-img-col {
        flex: none;
        width: 100%;
        min-height: 200px;
      }

      .pref-modal-info-col {
        padding: 24px 20px 20px;
      }
    }
  </style>
</head>

<body>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <header class="accessibility-header">
    <div class="header-inner">
      <div class="site-logo-area">
        <a href="index.html" style="text-decoration:none;display:flex;align-items:center;">
          <img src="https://placehold.co/200x50/2a2a4e/ffffff?text=Local+Gourmet" alt="ローカルグルメマップ" class="cit-logo"
            onerror="this.style.display='none'">
        </a>
      </div>
      <div class="settings-area">
        <div class="setting-group">
          <span class="setting-label">Language</span>
          <button id="lang-jp" class="setting-btn active" aria-pressed="true">日本語</button>
          <button id="lang-en" class="setting-btn" aria-pressed="false">English</button>
        </div>
        <div class="setting-group">
          <span class="setting-label" id="label-font">文字サイズ</span>
          <button id="font-std" class="setting-btn active" aria-pressed="true">標準</button>
          <button id="font-lg" class="setting-btn" aria-pressed="false">拡大</button>
        </div>
        <div class="setting-group">
          <span class="setting-label" id="label-theme">背景色</span>
          <button id="color-dark" class="setting-btn active" aria-pressed="true">黒</button>
          <button id="color-light" class="setting-btn" aria-pressed="false">白</button>
        </div>
        <a id="back-to-map-btn" href="index.html" class="neon-button"
          style="padding:8px 18px;font-size:0.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:5px;">
          🗾 <span id="back-label">地図に戻る</span>
        </a>
      </div>
    </div>
  </header>

  <main id="pref-main" style="max-width:1200px;margin:36px auto;padding:0 20px;">

    <!-- Hero -->
    <section class="pref-hero-section">
      <span class="pref-hero-badge">🗾 <span id="pref-badge">地域情報</span></span>
      <h1 id="hero-title">〇〇県 の旬の食材</h1>
      <p id="hero-subtitle">その土地ならではの旬の魅力をお届けします。</p>
    </section>

    <!-- Season Filters -->
    <div class="season-filter-bar" id="filter-bar" role="group" aria-label="季節フィルター">
      <span class="filter-label" id="filter-label">🌸 季節絞り込み:</span>
      <button class="season-btn active" data-season="all">🍽 <span id="btn-all">すべて</span></button>
      <button class="season-btn" data-season="spring">🌸 <span id="btn-spring">春</span></button>
      <button class="season-btn" data-season="summer">☀️ <span id="btn-summer">夏</span></button>
      <button class="season-btn" data-season="autumn">🍂 <span id="btn-autumn">秋</span></button>
      <button class="season-btn" data-season="winter">❄️ <span id="btn-winter">冬</span></button>
    </div>

    <!-- Card Grid -->
    <div id="food-grid" class="pref-food-grid" aria-live="polite"></div>
  </main>

  <!-- Detail Modal -->
  <div id="pref-modal" class="pref-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pref-modal-title">
    <div class="pref-modal-box">
      <button class="pref-modal-close" id="pref-modal-close" aria-label="閉じる">×</button>
      <div class="pref-modal-img-col">
        <img id="pref-modal-img" src="" alt="" loading="lazy"
          onerror="this.onerror=null;this.src='https://placehold.co/300x300/334155/white?text=No+Image'">
      </div>
      <div class="pref-modal-info-col">
        <span id="pref-modal-season-badge" class="pref-modal-season-badge"></span>
        <h3 id="pref-modal-title"></h3>
        <p class="modal-description" id="pref-modal-desc"></p>
        <hr class="pref-modal-divider">
        <div class="modal-meta-row">
          <h4 id="label-dish">🍴 関連する郷土料理</h4>
          <p id="pref-modal-dish"></p>
        </div>
        <div class="modal-meta-row">
          <h4 id="label-market">🛒 どこで楽しめる？</h4>
          <p id="pref-modal-market"></p>
        </div>
        <div class="pref-modal-actions">
          <button class="modal-fav-btn" id="pref-modal-fav-btn">❤ <span id="modal-fav-label">お気に入り</span></button>
          <a id="pref-modal-map-link" href="#" target="_blank" rel="noopener noreferrer" class="neon-button"
            style="background:linear-gradient(135deg,#28a745,#20c997);box-shadow:0 6px 15px rgba(40,167,69,0.3);">
            📍 <span id="label-map">Googleマップ</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="copyright">© 2026 DS Course Project - Chiba Institute of Technology</p>
  </footer>

  <script src="data.js"></script>
  <script>
    (function () {
      'use strict';

      // ── 許可された県IDのリスト ──────────────────────────────────
      const SAFE_PREFS = ['gunma', 'tochigi', 'ibaraki', 'saitama', 'chiba', 'tokyo', 'kanagawa'];

      const prefMeta = {
        gunma: { ja: '群馬県', en: 'Gunma', emoji: '🏔' },
        tochigi: { ja: '栃木県', en: 'Tochigi', emoji: '🍓' },
        ibaraki: { ja: '茨城県', en: 'Ibaraki', emoji: '🍈' },
        saitama: { ja: '埼玉県', en: 'Saitama', emoji: '🍵' },
        chiba: { ja: '千葉県', en: 'Chiba', emoji: '🥜' },
        tokyo: { ja: '東京都', en: 'Tokyo', emoji: '🏙' },
        kanagawa: { ja: '神奈川県', en: 'Kanagawa', emoji: '🐟' },
      };

      const seasonMeta = {
        spring: { ja: '春', en: 'Spring', emoji: '🌸', cssClass: 'season-spring' },
        summer: { ja: '夏', en: 'Summer', emoji: '☀️', cssClass: 'season-summer' },
        autumn: { ja: '秋', en: 'Autumn', emoji: '🍂', cssClass: 'season-autumn' },
        winter: { ja: '冬', en: 'Winter', emoji: '❄️', cssClass: 'season-winter' },
      };

      // ── URLパラメータから安全に県IDを取得 ────────────────────────
      const params = new URLSearchParams(window.location.search);
      const rawPref = params.get('pref') || '';
      const prefId = SAFE_PREFS.includes(rawPref) ? rawPref : 'gunma';

      // ── 永続設定の読み込み ────────────────────────────────────────
      let lang = localStorage.getItem('lang') || 'jp';
      let theme = localStorage.getItem('theme') || 'dark';
      let fontSize = localStorage.getItem('fontSize') || 'std';

      // お気に入りは数値IDの配列で管理（index.htmlと共有）
      let favorites = [];
      try {
        favorites = JSON.parse(localStorage.getItem('favorites') || '[]').map(id => parseInt(id, 10));
      } catch (_) { favorites = []; }

      // 現在モーダルで表示中のアイテム
      let currentModalItem = null;

      // ── i18n ─────────────────────────────────────────────────────
      const i18n = {
        jp: {
          badge: '地域情報', titleSuffix: 'の旬の食材',
          subtitle: 'その土地ならではの旬の魅力をお届けします。',
          filterLabel: '🌸 季節絞り込み:', backLabel: '地図に戻る',
          btnAll: 'すべて', btnSpring: '春', btnSummer: '夏', btnAutumn: '秋', btnWinter: '冬',
          labelDish: '🍴 関連する郷土料理', labelMarket: '🛒 どこで楽しめる？', labelMap: 'Googleマップ',
          detailHint: '詳細を見る →',
          modalFav: 'お気に入り登録', modalFavActive: 'お気に入り済み',
          addedFav: 'お気に入りに追加しました ❤', removedFav: 'お気に入りから削除しました',
          noFood: 'この季節に該当する食材は見つかりませんでした。',
          labelFont: '文字サイズ', labelTheme: '背景色',
        },
        en: {
          badge: 'Region Info', titleSuffix: ' Seasonal Specialties',
          subtitle: 'Bringing you the unique seasonal charms of the region.',
          filterLabel: '🌸 Filter Season:', backLabel: 'Back to Map',
          btnAll: 'All', btnSpring: 'Spring', btnSummer: 'Summer', btnAutumn: 'Autumn', btnWinter: 'Winter',
          labelDish: '🍴 Local Cuisine', labelMarket: '🛒 Where to enjoy?', labelMap: 'Google Maps',
          detailHint: 'View details →',
          modalFav: 'Add to Favorites', modalFavActive: 'Favorited',
          addedFav: 'Added to favorites ❤', removedFav: 'Removed from favorites',
          noFood: 'No specialties found for this season.',
          labelFont: 'Font Size', labelTheme: 'Theme',
        }
      };

      // ── Toast ─────────────────────────────────────────────────────
      function showToast(msg) {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        c.appendChild(t);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
        });
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
      }

      // ── favorites utils ───────────────────────────────────────────
      function isFav(id) { return favorites.includes(parseInt(id, 10)); }

      function toggleFavById(id) {
        const numId = parseInt(id, 10);
        const idx = favorites.indexOf(numId);
        if (idx === -1) {
          favorites.push(numId);
          showToast(i18n[lang].addedFav);
        } else {
          favorites.splice(idx, 1);
          showToast(i18n[lang].removedFav);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
      }

      // ── render cards ──────────────────────────────────────────────
      function renderFoods(season) {
        const grid = document.getElementById('food-grid');
        if (!grid || !window.specialtyDatabase) return;
        grid.textContent = '';

        let list = window.specialtyDatabase.filter(item => item.prefecture === prefId);
        if (season && season !== 'all') {
          list = list.filter(item => item.season === season);
        }

        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          const icon = document.createElement('div');
          icon.className = 'empty-icon';
          icon.textContent = '🍽';
          const msg = document.createElement('p');
          msg.textContent = i18n[lang].noFood;
          empty.appendChild(icon);
          empty.appendChild(msg);
          grid.appendChild(empty);
          return;
        }

        list.forEach(item => {
          const sm = seasonMeta[item.season] || { ja: '', en: '', emoji: '', cssClass: '' };
          const card = document.createElement('div');
          card.className = 'food-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', item.name);

          // Image wrapper
          const imgWrap = document.createElement('div');
          imgWrap.className = 'food-card-img-wrap';

          const img = document.createElement('img');
          img.src = item.imageSrc;
          img.alt = item.name;
          img.loading = 'lazy';
          img.onerror = () => { img.onerror = null; img.src = 'https://placehold.co/300x160/334155/white?text=No+Image'; };

          // Season badge
          const seasonBadge = document.createElement('span');
          seasonBadge.className = 'food-card-season-badge ' + sm.cssClass;
          seasonBadge.textContent = sm.emoji + ' ' + (lang === 'en' ? sm.en : sm.ja);

          // Fav button
          const favBtn = document.createElement('button');
          favBtn.className = 'food-card-fav' + (isFav(item.id) ? ' active' : '');
          favBtn.setAttribute('aria-label', 'お気に入り');
          favBtn.textContent = '❤';
          favBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavById(item.id);
            favBtn.classList.toggle('active', isFav(item.id));
            // sync modal fav btn if same item is open
            if (currentModalItem && currentModalItem.id === item.id) {
              syncModalFavBtn();
            }
          });

          imgWrap.appendChild(img);
          imgWrap.appendChild(seasonBadge);
          imgWrap.appendChild(favBtn);

          // Card body
          const body = document.createElement('div');
          body.className = 'food-card-body';

          const h4 = document.createElement('h4');
          h4.textContent = item.name;

          const desc = document.createElement('p');
          desc.textContent = item.description;

          const hint = document.createElement('span');
          hint.className = 'food-card-detail-hint';
          hint.textContent = i18n[lang].detailHint;

          body.appendChild(h4);
          body.appendChild(desc);
          body.appendChild(hint);

          card.appendChild(imgWrap);
          card.appendChild(body);

          // Open modal on click
          card.addEventListener('click', () => openModal(item));
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item); } });

          grid.appendChild(card);
        });
      }

      // ── Modal ─────────────────────────────────────────────────────
      const overlay = document.getElementById('pref-modal');
      const closeBtn = document.getElementById('pref-modal-close');
      const modalFavBtn = document.getElementById('pref-modal-fav-btn');

      function openModal(item) {
        currentModalItem = item;
        const sm = seasonMeta[item.season] || { ja: '', en: '', emoji: '', cssClass: '' };

        document.getElementById('pref-modal-img').src = item.imageSrc;
        document.getElementById('pref-modal-title').textContent = item.name;
        document.getElementById('pref-modal-desc').textContent = item.description;
        document.getElementById('pref-modal-dish').textContent = item.localDish || '-';
        document.getElementById('pref-modal-market').textContent = item.marketInfo || '-';

        const seasonBadge = document.getElementById('pref-modal-season-badge');
        seasonBadge.className = 'pref-modal-season-badge ' + sm.cssClass;
        seasonBadge.textContent = sm.emoji + ' ' + (lang === 'en' ? sm.en : sm.ja);

        const mapLink = document.getElementById('pref-modal-map-link');
        mapLink.href = item.mapSearchUrl || `https://www.google.com/maps/search/${encodeURIComponent(item.name + ' 直売所')}`;

        syncModalFavBtn();
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        closeBtn.focus();
      }

      function syncModalFavBtn() {
        if (!currentModalItem) return;
        const active = isFav(currentModalItem.id);
        modalFavBtn.classList.toggle('active', active);
        const t = i18n[lang];
        const label = document.getElementById('modal-fav-label');
        if (label) label.textContent = active ? t.modalFavActive : t.modalFav;
      }

      function closeModal() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        currentModalItem = null;
      }

      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      if (modalFavBtn) {
        modalFavBtn.addEventListener('click', () => {
          if (!currentModalItem) return;
          toggleFavById(currentModalItem.id);
          syncModalFavBtn();
          // Also update the card's fav btn in the grid
          refreshCardFavBtns();
        });
      }

      function refreshCardFavBtns() {
        document.querySelectorAll('.food-card').forEach((card, i) => {
          const favBtn = card.querySelector('.food-card-fav');
          // Re-render is simpler; but just toggle class for perf
          if (favBtn) {
            const activeBtn = document.querySelector('#filter-bar .season-btn.active');
            const season = activeBtn ? activeBtn.dataset.season : 'all';
            let list = (window.specialtyDatabase || []).filter(item => item.prefecture === prefId);
            if (season && season !== 'all') list = list.filter(item => item.season === season);
            if (list[i]) favBtn.classList.toggle('active', isFav(list[i].id));
          }
        });
      }

      // ── Season filter ─────────────────────────────────────────────
      document.querySelectorAll('#filter-bar .season-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#filter-bar .season-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderFoods(btn.dataset.season);
        });
      });

      // ── applySettings – UI text, theme, font ──────────────────────
      function applySettings() {
        const t = i18n[lang];
        const meta = prefMeta[prefId] || prefMeta.gunma;
        const prefName = lang === 'en' ? meta.en : meta.ja;

        // Title
        document.title = prefName + (lang === 'en' ? ' - Seasonal Specialties' : ' 旬の食材');

        // Hero
        document.getElementById('pref-badge').textContent = t.badge;
        document.getElementById('hero-title').textContent = meta.emoji + ' ' + prefName + t.titleSuffix;
        document.getElementById('hero-subtitle').textContent = t.subtitle;

        // Filter bar
        document.getElementById('filter-label').textContent = t.filterLabel;
        document.getElementById('btn-all').textContent = t.btnAll;
        document.getElementById('btn-spring').textContent = t.btnSpring;
        document.getElementById('btn-summer').textContent = t.btnSummer;
        document.getElementById('btn-autumn').textContent = t.btnAutumn;
        document.getElementById('btn-winter').textContent = t.btnWinter;

        // Back button
        const backLabel = document.getElementById('back-label');
        if (backLabel) backLabel.textContent = t.backLabel;

        // Modal labels
        const labelDish = document.getElementById('label-dish');
        const labelMarket = document.getElementById('label-market');
        const labelMap = document.getElementById('label-map');
        if (labelDish) labelDish.textContent = t.labelDish;
        if (labelMarket) labelMarket.textContent = t.labelMarket;
        if (labelMap) labelMap.textContent = t.labelMap;

        // Settings labels
        const labelFont = document.getElementById('label-font');
        const labelTheme = document.getElementById('label-theme');
        if (labelFont) labelFont.textContent = t.labelFont;
        if (labelTheme) labelTheme.textContent = t.labelTheme;

        // Lang buttons
        document.getElementById('lang-jp').classList.toggle('active', lang === 'jp');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.getElementById('lang-jp').setAttribute('aria-pressed', lang === 'jp' ? 'true' : 'false');
        document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');

        // Theme
        if (theme === 'light') {
          document.body.classList.add('light-mode');
        } else {
          document.body.classList.remove('light-mode');
        }
        document.getElementById('color-dark').classList.toggle('active', theme === 'dark');
        document.getElementById('color-light').classList.toggle('active', theme === 'light');
        document.getElementById('color-dark').setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        document.getElementById('color-light').setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');

        // Font size
        document.documentElement.style.fontSize = fontSize === 'lg' ? '18px' : '16px';
        document.getElementById('font-std').classList.toggle('active', fontSize === 'std');
        document.getElementById('font-lg').classList.toggle('active', fontSize === 'lg');
        document.getElementById('font-std').setAttribute('aria-pressed', fontSize === 'std' ? 'true' : 'false');
        document.getElementById('font-lg').setAttribute('aria-pressed', fontSize === 'lg' ? 'true' : 'false');

        // Re-render cards to reflect language on badges / hints
        const activeSeason = (document.querySelector('#filter-bar .season-btn.active') || {}).dataset?.season || 'all';
        renderFoods(activeSeason);

        // Update modal fav label if open
        syncModalFavBtn();
      }

      // ── Settings button listeners ─────────────────────────────────
      document.getElementById('lang-jp').addEventListener('click', () => {
        lang = 'jp'; localStorage.setItem('lang', 'jp'); applySettings(); showToast('日本語に切り替えました');
      });
      document.getElementById('lang-en').addEventListener('click', () => {
        lang = 'en'; localStorage.setItem('lang', 'en'); applySettings(); showToast('Switched to English');
      });
      document.getElementById('font-std').addEventListener('click', () => {
        fontSize = 'std'; localStorage.setItem('fontSize', 'std'); applySettings();
      });
      document.getElementById('font-lg').addEventListener('click', () => {
        fontSize = 'lg'; localStorage.setItem('fontSize', 'lg'); applySettings();
      });
      document.getElementById('color-dark').addEventListener('click', () => {
        theme = 'dark'; localStorage.setItem('theme', 'dark'); applySettings();
      });
      document.getElementById('color-light').addEventListener('click', () => {
        theme = 'light'; localStorage.setItem('theme', 'light'); applySettings();
      });

      // ── Initial render ────────────────────────────────────────────
      // Wait for data.js to ensure window.specialtyDatabase is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applySettings);
      } else {
        applySettings();
      }
    })();
  </script>
</body>

</html>
